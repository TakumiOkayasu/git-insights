name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: xvfb-run -a pnpm test:host
        if: runner.os == 'Linux'
      - run: pnpm test:host
        if: runner.os == 'Windows'
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: git-insights-${{ matrix.os }}
          path: "*.vsix"
