name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: xvfb-run -a bun run test:host
        if: runner.os == 'Linux'
      - run: bun run test:host
        if: runner.os != 'Linux'
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: git-insights-${{ matrix.os }}
          path: "*.vsix"
          if-no-files-found: error
